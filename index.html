<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asma-ul-Husna | 99 Names of Allah</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>أَسْمَاءُ اللَّهِ الْحُسْنَى</h1>
        <h2>Asma-ul-Husna</h2>
        <p>The 99 Beautiful Names of Allah</p>
    </header>

    <section class="intro">
        <h2>ٱللَّٰهُ</h2>
        <p>Remember Allah through His beautiful names</p>
        <div class="counter">99 Beautiful Names</div>
    </section>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Search Allah's names..."
        >
    </div>

    <main>
        <div class="names-container" id="namesContainer"></div>
    </main>

    <footer>
        <h2>سُبْحَانَ اللَّهِ</h2>
        <p>Glory be to Allah</p>
        <p>Made with ❤️ for remembering Allah</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
